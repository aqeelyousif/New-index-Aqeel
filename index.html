<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع عقيل | تتبع الإنجاز الطبي</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .progress-gradient { background: linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%); transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="text-slate-800 pb-32">

<!-- Header / Navigation -->
<header class="bg-white/80 backdrop-blur-md shadow-sm p-4 flex justify-between items-center sticky top-0 z-50 border-b border-slate-200/60">
    <div class="text-xl font-black text-blue-600 flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/30">
            <i class="fa-solid fa-stethoscope text-lg"></i>
        </div>
        <span>عقيل <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-100">طبي</span></span>
    </div>
    <button onclick="toggleAdminPanel()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg shadow-slate-900/20 flex items-center gap-2 transition-all active:scale-95">
        <i class="fa-solid fa-sliders text-blue-400"></i> لوحة التحكم
    </button>
</header>

<!-- Main Content -->
<main class="max-w-xl mx-auto mt-6 px-4">
    
    <!-- Admin Management Panel -->
    <div id="admin-panel" class="hidden bg-slate-900 text-white rounded-3xl p-6 mb-6 shadow-2xl border border-slate-700/80">
        <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
            <h3 class="font-bold text-sm text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> تخصيص وإدارة السشنات
            </h3>
            <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white bg-slate-800/80 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="space-y-4 text-sm">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">اختر الموديول:</label>
                <select id="admin-mod-id" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                    <option value="msk">MSK</option>
                    <option value="cvs">CVS</option>
                    <option value="mnr">M&R</option>
                    <option value="mod">MOD</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">اسم السشن (مثال: Session 7):</label>
                <input type="text" id="admin-session-name" placeholder="Session X" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">أجزاء السشن (أدخل أسماء الأجزاء مفصولة بفاصلة، مثل: جزء 1, جزء 2, لاب):</label>
                <input type="text" id="admin-session-parts" placeholder="جزء 1, جزء 2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="addNewSession()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/30 transition-all active:scale-[0.98]">
                إضافة السشن بالأجزاء فوراً
            </button>
            <button onclick="resetToDefault()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold py-2.5 rounded-xl border border-red-500/20 transition-colors mt-2">
                إعادة ضبط الموديولات للافتراضي
            </button>
        </div>
    </div>

    <!-- Tracker Card -->
    <div class="glass-card rounded-3xl p-6 mb-6 custom-shadow relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full blur-2xl pointer-events-none"></div>

        <div class="flex justify-between items-center mb-5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-lg border border-blue-100">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h2 class="text-base font-black text-slate-900">Summative Exam</h2>
                    <p class="text-xs text-slate-400 font-medium">متابعة المنهج الدراسي بدقة</p>
                </div>
            </div>
            <span class="text-slate-500 text-xs font-bold bg-slate-100/80 px-3.5 py-1.5 rounded-xl border border-slate-200/60 flex items-center gap-1.5">
                <i class="fa-regular fa-calendar text-blue-500"></i> 12/11/2026
            </span>
        </div>

        <!-- Total Progress -->
        <div class="bg-white/80 p-4.5 rounded-2xl mb-6 border border-slate-100 shadow-sm">
            <div class="flex justify-between items-center mb-2.5">
                <span class="font-bold text-slate-700 text-sm">الإنجاز الإجمالي</span>
                <span id="total-text" class="font-black text-blue-600 text-sm bg-blue-50 px-2.5 py-0.5 rounded-lg">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3.5 p-0.5 border border-slate-200/40">
                <div id="total-progress" class="progress-gradient h-full rounded-full" style="width: 0%"></div>
            </div>
        </div>

        <!-- Modules Accordion Container -->
        <div id="modules-container" class="space-y-3.5">
            <!-- Rendered dynamically -->
        </div>
    </div>

</main>

<!-- Sticky Save Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-200/60 p-4 shadow-2xl z-50">
    <div class="max-w-xl mx-auto flex flex-col items-center gap-2">
        <span id="save-status" class="text-xs text-slate-400 font-bold transition-all">التقدم محفوظ محلياً</span>
        <button onclick="saveProgress()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-3.5 rounded-2xl flex justify-center items-center gap-2.5 shadow-lg shadow-blue-600/25 transition-all active:scale-[0.99]">
            <i class="fa-solid fa-floppy-disk text-lg"></i> حفظ التغييرات والتقدم
        </button>
    </div>
</div>

<script>
    const defaultModules = [
        {
            id: 'msk',
            name: 'MSK',
            sessions: [
                { id: 'msk_s1', name: 'Session 1', parts: ['جزء 1', 'جزء 2'] },
                { id: 'msk_s2', name: 'Session 2', parts: ['جزء 1', 'جزء 2', 'لاب'] },
                { id: 'msk_s3', name: 'Session 3', parts: ['جزء 1', 'جزء 2'] },
                { id: 'msk_s4', name: 'Session 4', parts: ['جزء 1', 'جزء 2', 'لاب'] },
                { id: 'msk_s5', name: 'Session 5', parts: ['جزء 1'] }
            ]
        },
        {
            id: 'cvs',
            name: 'CVS',
            sessions: [
                { id: 'cvs_s1', name: 'Session 1', parts: ['محاضرة 1'] },
                { id: 'cvs_s2', name: 'Session 2', parts: ['محاضرة 1'] },
                { id: 'cvs_s3', name: 'Session 3', parts: ['جزء 1', 'جزء 2'] },
                { id: 'cvs_s4', name: 'Session 4', parts: ['جزء 1', 'جزء 2'] },
                { id: 'cvs_s5', name: 'Session 5', parts: ['جزء 1', 'جزء 2'] }
            ]
        },
        {
            id: 'mnr',
            name: 'M&R',
            sessions: [
                { id: 'mnr_s1', name: 'Session 1', parts: ['جزء 1', 'جزء 2'] },
                { id: 'mnr_s2', name: 'Session 2', parts: ['جزء 1', 'جزء 2'] },
                { id: 'mnr_s3', name: 'Session 3', parts: ['جزء 1', 'جزء 2'] },
                { id: 'mnr_s4', name: 'Session 4', parts: ['جزء 1', 'جزء 2'] },
                { id: 'mnr_s5', name: 'Session 5', parts: ['جزء 1', 'جزء 2'] },
                { id: 'mnr_s6', name: 'Session 6', parts: ['جزء 1', 'جزء 2'] }
            ]
        },
        {
            id: 'mod',
            name: 'MOD',
            sessions: [
                { id: 'mod_s1', name: 'Session 1', parts: ['جزء 1', 'جزء 2', 'جزء 3'] },
                { id: 'mod_s2', name: 'Session 2', parts: ['محاضرة 1'] },
                { id: 'mod_s3', name: 'Session 3', parts: ['محاضرة 1'] },
                { id: 'mod_s4', name: 'Session 4', parts: ['محاضرة 1'] },
                { id: 'mod_s5', name: 'Session 5', parts: ['محاضرة 1'] },
                { id: 'mod_s6', name: 'Session 6', parts: ['محاضرة 1'] }
            ]
        }
    ];

    let modules = JSON.parse(localStorage.getItem('aqeel_modules_struct_v4')) || defaultModules;
    let savedState = JSON.parse(localStorage.getItem('aqeel_progress_v4')) || {};

    function toggleAdminPanel() {
        const panel = document.getElementById('admin-panel');
        panel.classList.toggle('hidden');
    }

    function addNewSession() {
        const modId = document.getElementById('admin-mod-id').value;
        const sessionName = document.getElementById('admin-session-name').value.trim();
        const partsInput = document.getElementById('admin-session-parts').value.trim();

        if (!sessionName || !partsInput) {
            alert('يرجى إدخال اسم السشن وأجزائه!');
            return;
        }

        const partsArray = partsInput.split(',').map(p => p.trim()).filter(p => p);

        const targetMod = modules.find(m => m.id === modId);
        if (targetMod) {
            const newId = `${modId}_custom_${Date.now()}`;
            const newSession = {
                id: newId,
                name: sessionName,
                parts: partsArray
            };
            targetMod.sessions.push(newSession);
            localStorage.setItem('aqeel_modules_struct_v4', JSON.stringify(modules));
            renderModules();
            toggleAdminPanel();
            document.getElementById('admin-session-name').value = '';
            document.getElementById('admin-session-parts').value = '';
            alert('تمت إضافة السشن مع أجزائه بنجاح!');
        }
    }

    function resetToDefault() {
        if (confirm('هل أنت متأكد من إعادة الضبط للافتراضي؟')) {
            localStorage.removeItem('aqeel_modules_struct_v4');
            modules = JSON.parse(JSON.stringify(defaultModules));
            renderModules();
            toggleAdminPanel();
        }
    }

    function renderModules() {
        const container = document.getElementById('modules-container');
        container.innerHTML = '';

        modules.forEach(mod => {
            let modTotalParts = 0;
            let modCompletedParts = 0;

            let sessionsHtml = mod.sessions.map(session => {
                let partsHtml = session.parts.map((part, index) => {
                    const partId = `${session.id}_p${index}`;
                    const isChecked = savedState[partId] ? 'checked' : '';
                    modTotalParts++;
                    if (isChecked) modCompletedParts++;

                    return `
                        <label class="flex items-center justify-between gap-2 cursor-pointer bg-white hover:bg-blue-50/50 px-3 py-2 rounded-xl border border-slate-100 shadow-sm transition-colors">
                            <span class="text-xs font-bold text-slate-700">${part}</span>
                            <input type="checkbox" class="w-4 h-4 accent-blue-600 rounded cursor-pointer" 
                                   id="${partId}" ${isChecked} onchange="updateProgress('${partId}', this.checked)">
                        </label>
                    `;
                }).join('');

                return `
                    <div class="border border-slate-100 rounded-2xl p-3.5 mb-2.5 bg-slate-50/60">
                        <div class="flex justify-between items-center mb-2.5 px-1">
                            <span class="font-black text-slate-700 text-xs">${session.name}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            ${partsHtml}
                        </div>
                    </div>
                `;
            }).join('');

            const modPercentage = modTotalParts > 0 ? Math.round((modCompletedParts / modTotalParts) * 100) : 0;

            const modHtml = `
                <div class="border border-slate-200/80 rounded-2xl overflow-hidden bg-white/60 shadow-sm transition-all">
                    <button class="w-full p-4 flex justify-between items-center text-slate-800 font-black hover:bg-blue-50/50 transition-colors" onclick="toggleModule('${mod.id}')">
                        <div class="flex items-center gap-2.5">
                            <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                            <span class="text-sm">${mod.name}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-xl font-black">${modPercentage}%</span>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-300" id="icon-${mod.id}"></i>
                        </div>
                    </button>
                    <div id="content-${mod.id}" class="hidden p-3.5 bg-slate-50/50 border-t border-slate-100 space-y-2">
                        ${sessionsHtml}
                    </div>
                </div>
            `;
            container.innerHTML += modHtml;
        });

        updateTotalProgress();
    }

    function toggleModule(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        if (content.classList.contains('hidden')) {
            content.classList.remove('hidden');
            icon.style.transform = 'rotate(180deg)';
        } else {
            content.classList.add('hidden');
            icon.style.transform = 'rotate(0deg)';
        }
    }

    function updateProgress(partId, isChecked) {
        savedState[partId] = isChecked;
        markUnsaved();
        renderModules();
    }

    function markUnsaved() {
        const statusText = document.getElementById('save-status');
        statusText.innerText = 'يوجد تغييرات غير محفوظة..';
        statusText.className = 'text-xs text-amber-600 font-bold';
    }

    function updateTotalProgress() {
        let total = 0;
        let completed = 0;

        modules.forEach(mod => {
            mod.sessions.forEach(session => {
                session.parts.forEach((part, index) => {
                    total++;
                    if (savedState[`${session.id}_p${index}`]) completed++;
                });
            });
        });

        const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById('total-text').innerText = `${percentage}%`;
        document.getElementById('total-progress').style.width = `${percentage}%`;
    }

    function saveProgress() {
        localStorage.setItem('aqeel_progress_v4', JSON.stringify(savedState));
        const statusText = document.getElementById('save-status');
        statusText.innerText = 'تم الحفظ بنجاح ✓';
        statusText.className = 'text-xs text-emerald-600 font-black';
        
        setTimeout(() => {
            statusText.innerText = 'التقدم محفوظ محلياً';
            statusText.className = 'text-xs text-slate-400 font-bold';
        }, 3000);
    }

    renderModules();
</script>
</body>
</html>
<script src="script.js"></script>
